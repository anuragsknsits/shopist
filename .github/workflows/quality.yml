name: UI quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - name: Build production image and enforce 200 MB limit
        run: |
          docker build --target production -t shopist:production .
          size=$(docker image inspect shopist:production --format '{{.Size}}')
          echo "Production image size: ${size} bytes (limit: 200000000)"
          test "$size" -le 200000000
